<main class="page-shell">
  <div class="overflow-x-auto">
    <table class="w-full min-w-[560px] table-auto border-collapse">
      <thead>
        <tr>
          <th class="px-4 py-3 text-left">Name</th>
          <th class="whitespace-nowrap px-4 py-3 text-left">Total hours</th>
          <th class="w-28 px-4 py-3 text-left">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr
          *ngFor="let employee of data()"
          class="border-b border-gray-300"
          [ngClass]="{ 'bg-red-200': employee.TotalHours < 100 }"
        >
          <td class="px-4 py-2">{{ employee.EmployeeName }}</td>
          <td class="whitespace-nowrap px-4 py-2">
            {{ employee.TotalHours | number:'1.1-2' }} hrs
          </td>
          <td class="px-4 py-2"><button type="button">Edit</button></td>
        </tr>
      </tbody>
    </table>
  </div>

  <section class="mx-auto mt-8 w-full max-w-xl rounded-lg bg-white p-4 shadow">
    <h2 class="mb-4 text-center text-xl font-semibold">Ukupni sati po zaposlenom</h2>
    <div class="relative h-96">
      <canvas
        baseChart
        [type]="'pie'"
        [data]="pieChartData"
        [options]="pieChartOptions"
      ></canvas>
    </div>
  </section>
</main>
